<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>柚子 · 个人手机版</title>
  <link rel="stylesheet" href="/assets/mobile.css">
  <script src="/assets/auth.js" defer></script>
  <script src="/assets/shipments.js" defer></script>
  <script src="/assets/todos.js" defer></script>
  <script src="/assets/home.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">柚</span><span class="tag">柚子<span class="brand-divider"> / </span>个人工作台</span></div>
      <h1 id="title">正在连接</h1>
      <p id="intro">正在检查个人账号状态…</p>
    </header>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="credentials" hidden>
      <form id="credentials-form">
        <label for="username">个人账号</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="48" pattern="[A-Za-z0-9_-]{3,48}" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <div id="confirm-group" hidden>
          <label for="confirm-password">再次输入密码</label>
          <input id="confirm-password" type="password" autocomplete="new-password" maxlength="256">
        </div>
        <button id="submit" type="submit">登录</button>
      </form>
    </section>
    <section id="account" hidden>
      <p>当前登录：<strong id="account-name"></strong></p>
      <details>
        <summary>账号设置</summary>
        <form id="password-form">
          <label for="current-password">当前密码</label>
          <input id="current-password" type="password" autocomplete="current-password" maxlength="256" required>
          <label for="new-password">新密码（至少 12 个字符）</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
          <label for="repeat-password">再次输入新密码</label>
          <input id="repeat-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
          <button type="submit">修改并退出所有登录</button>
        </form>
      <button id="logout" type="button" class="secondary">退出登录</button>
      </details>
    </section>
    <section id="home-module" hidden>
      <div class="home-welcome"><span>物流工作台</span><span id="home-date"></span></div>
      <p id="dashboard-status" class="data-hint" role="status" aria-live="polite"></p>
      <div class="overview-grid"><article class="overview-card"><span class="app-icon icon-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10"/></svg></span><h2>未签收</h2><strong id="overview-unsigned">—</strong><small>当前运单</small></article><article class="overview-card"><span class="app-icon icon-arrival"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M5 4l6 9 8-5M11 13l-5-1M11 13l1-5"/></svg></span><h2>今日到港</h2><strong id="overview-arrived">—</strong><small>实际到港</small></article><article class="overview-card"><span class="app-icon icon-check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg></span><h2>今日签收</h2><strong id="overview-signed">—</strong><small>轨迹节点</small></article><article class="overview-card"><span class="app-icon icon-bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><h2>待跟进</h2><strong id="overview-pending">—</strong><small>异常提醒</small></article></div>
      <section class="dashboard-panel">
        <div class="section-heading"><h2>我的待办</h2><button id="home-todo-all" type="button" class="text-link">全部 <span aria-hidden="true">›</span></button></div>
        <button id="home-todo-open" type="button" class="task-row">
          <span class="app-icon icon-bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span>
          <span class="task-copy"><strong>异常待跟进</strong><small id="home-todo-description">正在加载提醒</small></span>
          <span id="home-todo-count" class="count-badge">—</span><span class="row-chevron" aria-hidden="true">›</span>
        </button>
      </section>
      <section class="dashboard-panel">
        <div class="section-heading"><h2>消息提醒</h2><button id="home-message-all" type="button" class="text-link">全部 <span aria-hidden="true">›</span></button></div>
        <p class="panel-caption">最近的待处理异常提醒</p>
        <div id="home-messages"></div>
      </section>
      <section class="dashboard-panel">
        <div class="section-heading"><h2>快捷入口</h2><span class="panel-caption">常用功能</span></div>
        <div class="quick-grid"><button id="quick-preport" type="button" class="quick-button"><span class="app-icon icon-preport"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M8 21V11h8v10M1 21h22M8 15h8"/></svg></span><span>港前运单</span></button><button id="quick-transit" type="button" class="quick-button"><span class="app-icon icon-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10"/></svg></span><span>在途运单</span></button><button id="quick-todos" type="button" class="quick-button"><span class="app-icon icon-bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><span>异常跟进</span></button><button id="quick-account" type="button" class="quick-button"><span class="app-icon icon-account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span>我的账号</span></button></div>
      </section>
      <section class="dashboard-panel status-panel">
      <div class="section-heading"><h2 id="home-heading">明细状态</h2><button id="home-refresh" type="button" class="secondary compact-button">刷新统计</button></div>
      <div class="tabs" aria-label="首页统计范围">
        <button id="home-all" type="button" aria-pressed="true">全部</button>
        <button id="home-today" type="button" class="secondary" aria-pressed="false">今日</button>
      </div>
      <p id="home-status" role="status" aria-live="polite"></p>
      <div id="home-cards" class="home-grid"></div>
      <p id="home-updated" class="data-hint"></p>
      <p id="home-description" class="data-hint home-explanation"></p>
      </section>
    </section>
    <div id="shipments-module" hidden>
      <section id="shipment-list-panel">
        <div class="tabs" aria-label="运单分类">
          <button id="workspace-preport" type="button" class="secondary">港前运单</button>
          <button id="workspace-transit" type="button">在途运单</button>
        </div>
        <div class="filter-grid">
          <div><label for="shipment-status">运单状态</label><select id="shipment-status"></select></div>
          <div><label for="shipment-customer">客户</label><select id="shipment-customer" aria-label="客户筛选"><option value="">全部客户</option></select></div>
        </div>
        <form id="search-form" class="search-form">
          <label for="shipment-search">运单号、货件号、客户编号或客户</label>
          <input id="shipment-search" type="search" enterkeyhint="search" maxlength="120" placeholder="输入编号或关键词" autocomplete="off">
          <button type="submit">查询</button>
        </form>
        <p class="data-hint">读取电脑已有数据，不触发同步。按运单号倒序排列。</p>
        <p id="list-status" role="status" aria-live="polite"></p>
        <div id="shipment-list"></div>
        <nav class="pager" aria-label="运单分页">
          <button id="list-prev" class="secondary" type="button">上一页</button>
          <span id="list-page"></span>
          <button id="list-next" class="secondary" type="button">下一页</button>
        </nav>
        <button id="list-retry" class="secondary" type="button" hidden>重新加载</button>
      </section>
      <section id="shipment-detail-panel" hidden>
        <button id="detail-back" class="secondary" type="button">返回列表</button>
        <p id="detail-status" role="status" aria-live="polite"></p>
        <div id="shipment-detail"></div>
        <div id="tracking-section" hidden>
          <h2>物流轨迹</h2>
          <div class="tabs" aria-label="轨迹来源">
            <button id="tracking-internal" type="button" aria-pressed="true">内部轨迹</button>
            <button id="tracking-carrier" type="button" class="secondary" aria-pressed="false">承运商轨迹</button>
          </div>
          <p id="tracking-status" role="status" aria-live="polite"></p>
          <ol id="tracking-list" class="timeline"></ol>
          <button id="tracking-more" class="secondary" type="button" hidden>加载更多轨迹</button>
          <button id="tracking-retry" class="secondary" type="button" hidden>重试轨迹</button>
        </div>
        <button id="detail-retry" class="secondary" type="button" hidden>重新加载详情</button>
      </section>
    </div>
    <section id="todos-module" hidden>
      <h2>异常跟进</h2>
      <p class="data-hint">与电脑端共用异常跟进提醒。完成本次跟进只关闭提醒，不解除运单异常。</p>
      <label for="todo-scope">处理状态</label>
      <select id="todo-scope">
        <option value="pending">待处理</option>
        <option value="resolved">已完成</option>
        <option value="all">全部</option>
      </select>
      <form id="todo-search-form" class="search-form">
        <label for="todo-search">运单号或客户</label>
        <input id="todo-search" type="search" maxlength="120" enterkeyhint="search" placeholder="搜索异常待办">
        <button type="submit">查询</button>
      </form>
      <p id="todo-status" role="status" aria-live="polite"></p>
      <div id="todo-list"></div>
      <nav class="pager" aria-label="待办分页">
        <button id="todo-prev" type="button" class="secondary">上一页</button>
        <span id="todo-page"></span>
        <button id="todo-next" type="button" class="secondary">下一页</button>
      </nav>
      <button id="todo-retry" type="button" class="secondary" hidden>重新加载</button>
    </section>
    <nav id="mobile-navigation" class="mobile-navigation" aria-label="主导航" hidden>
      <button id="nav-home" type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>首页</span></button>
      <button id="nav-shipments" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10M7.5 5 16 9"/></svg><span>运单</span></button>
      <button id="nav-todos" type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg><span>待办</span></button>
      <button id="nav-account" type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>我的</span></button>
    </nav>
    <button id="retry" type="button" class="secondary" hidden>重新连接</button>
    <p class="footnote">柚子 · 个人工作台</p>
  </main>
</body>
</html>
